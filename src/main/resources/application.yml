spring:
  application:
    name: petever-api
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
      - org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration
      - org.springframework.boot.flyway.autoconfigure.FlywayAutoConfiguration
      - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:NONE}
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}

petever:
  rate-limit:
    nearby-search:
      max-requests: ${NEARBY_RATE_LIMIT_MAX_REQUESTS:30}
      window-seconds: ${NEARBY_RATE_LIMIT_WINDOW_SECONDS:60}
      max-keys: ${NEARBY_RATE_LIMIT_MAX_KEYS:10000}
  vet-clinics:
    sync:
      enabled: ${VET_CLINIC_SYNC_ENABLED:false}
    source-url: ${VET_CLINIC_SOURCE_URL:https://file.localdata.go.kr/file/download/animal_hospitals/info}
